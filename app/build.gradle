plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    namespace "com.dawn.libprinter"

    defaultConfig {
        applicationId "com.dawn.libprinter"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation project(path: ':library')

    // DNP / HiTi 打印机 SDK（library 中为 compileOnly，app 层以 implementation 打包进 APK）
    implementation(name: 'DNPPrinterSDK-release', ext: 'aar')
    implementation(name: 'printerService-release', ext: 'aar')
}
