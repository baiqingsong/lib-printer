plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    compileSdk 34
    namespace "com.dawn.printers"

    defaultConfig {
        minSdk 24
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        ndk {
            abiFilters "armeabi-v7a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        aidl = true
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.baiqingsong'
                artifactId = 'lib-printer'
                version = '1.0.7'
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.annotation:annotation:1.6.0'

    // RxJava3（LLog / RxTask 依赖）
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    implementation 'io.reactivex.rxjava3:rxjava:3.0.0'

    // Gson（LJsonUtil 依赖）
    // implementation 'com.google.code.gson:gson:2.10.1'  // removed (only needed for UV JSON parsing)

    // EventBus（PrintFactory 依赖）
    implementation 'org.greenrobot:eventbus:3.3.1'

    // HiTi 打印机 SDK（compileOnly：消费方自行提供，避免重复打包）
    compileOnly fileTree(dir: 'libs', include: ['printsdk2.2.1.0-api26.jar'])

    // ====== 可选打印机 SDK（compileOnly：仅编译期，消费方按需自行添加） ======
    // DNP 打印机 SDK（DNP_RX1 / DNP_620 / DNP_410）
    compileOnly(name: 'DNPPrinterSDK-release', ext: 'aar')

    // 打印机服务 SDK
    compileOnly(name: 'printerService-release', ext: 'aar')
}
